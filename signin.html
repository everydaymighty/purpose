<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Pathway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .forgot {
    display: block;
    text-align: right;
    font-size: 13px;
    color: var(--purple-700);
    font-weight: 600;
    margin-top: -10px;
    margin-bottom: 18px;
  }
  .forgot:hover { text-decoration: underline; }
  .social-btn {
    width: 100%;
    padding: 12px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius-md);
    font-weight: 600;
    font-size: 14px;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all .15s ease;
  }
  .social-btn:hover { border-color: var(--purple-300); background: var(--purple-50); }
  .social-btn + .social-btn { margin-top: 10px; }
</style>
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="index.html" class="logo">
        <span class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20L12 4l8 16"/><path d="M8 14h8"/></svg>
        </span>
        Pathway
      </a>
    </div>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Sign in to continue your job search.</p>

    <form id="signinForm">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="input" type="email" id="email" name="email" placeholder="you@example.com" required>
        <div class="form-hint" id="emailError" style="color:var(--danger); display:none;">Please enter a valid email address.</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="input" type="password" id="password" name="password" placeholder="••••••••" required>
        <div class="form-hint" id="pwError" style="color:var(--danger); display:none;">Password must be at least 8 characters.</div>
      </div>

      <a href="#" class="forgot">Forgot password?</a>

      <button type="submit" class="btn btn-primary btn-full btn-lg">Sign in</button>
    </form>

    <div class="divider"><span>or continue with</span></div>

    <button class="social-btn" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0124 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 01-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
      Continue with Google
    </button>
    <button class="social-btn" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#000"><path d="M16.365 1.43c0 1.14-.493 2.27-1.177 3.08-.744.9-1.99 1.57-2.987 1.57-.12 0-.23-.02-.3-.03-.01-.06-.04-.22-.04-.39 0-1.15.572-2.27 1.206-2.98.804-.94 2.142-1.64 3.248-1.68.03.13.05.28.05.43zm4.565 15.71c-.03.07-.463 1.58-1.518 3.12-.945 1.34-1.94 2.71-3.43 2.71-1.517 0-1.9-.88-3.63-.88-1.698 0-2.302.91-3.67.91-1.49 0-2.534-1.39-3.502-2.71C1.255 18.31.5 15.6.5 13.02c0-4.15 2.713-6.35 5.378-6.35 1.41 0 2.59.96 3.484.96.85 0 2.17-1.01 3.73-1.01.59 0 2.7.06 4.06 2.03-.106.06-2.4 1.39-2.4 4.15 0 3.21 2.84 4.34 2.93 4.38z"/></svg>
      Continue with Apple
    </button>

    <p class="auth-foot">
      Don't have an account? <a href="signup.html">Sign up free</a>
    </p>
  </div>
</div>

<script>
  document.getElementById('signinForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const emailErr = document.getElementById('emailError');
    const pwErr = document.getElementById('pwError');
    let valid = true;

    // Reset
    emailErr.style.display = 'none';
    email.style.borderColor = '';
    pwErr.style.display = 'none';
    password.style.borderColor = '';

    // Validate email
    if (!email.value.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
      emailErr.style.display = '';
      email.style.borderColor = 'var(--danger)';
      valid = false;
    }

    // Validate password length
    if (password.value.length < 8) {
      pwErr.style.display = '';
      password.style.borderColor = 'var(--danger)';
      valid = false;
    }

    if (valid) {
      // Show loading state
      const btn = this.querySelector('button[type="submit"]');
      btn.textContent = 'Signing in…';
      btn.disabled = true;
      setTimeout(() => { window.location.href = 'profile.html'; }, 800);
    }
  });

  // Clear errors on input
  ['email', 'password'].forEach(id => {
    document.getElementById(id).addEventListener('input', function() {
      this.style.borderColor = '';
      const errId = id === 'email' ? 'emailError' : 'pwError';
      document.getElementById(errId).style.display = 'none';
    });
  });
</script>

</body>
</html>
